name: MyCarPlayBrowser iOS Device Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: MyCarPlayBrowser_iOS_v0.2
        run: |
          cat > project.yml <<'EOF2'
          name: MyCarPlayBrowser
          options:
            deploymentTarget:
              iOS: "17.0"
            createIntermediateGroups: true
          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
          targets:
            MyCarPlayBrowser:
              type: application
              platform: iOS
              sources:
                - path: MyCarPlayBrowser
                  excludes:
                    - "**/*.plist"
                    - "**/*.entitlements"
              resources:
                - path: MyCarPlayBrowser/Assets.xcassets
              info:
                path: MyCarPlayBrowser/Info.plist
              entitlements:
                path: MyCarPlayBrowser/MyCarPlayBrowser.entitlements
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ultor.mycarplaybrowser
                  PRODUCT_NAME: MyCarPlayBrowser
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  MARKETING_VERSION: "0.3"
                  CURRENT_PROJECT_VERSION: "3"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
              scheme:
                gatherCoverageData: false
                testTargets: []
          EOF2
          xcodegen generate
      - name: Build for iPhone
        working-directory: MyCarPlayBrowser_iOS_v0.2
        run: |
          rm -rf "$RUNNER_TEMP/MyCarPlayBrowserDerivedData"
          xcodebuild \
            -project MyCarPlayBrowser.xcodeproj \
            -scheme MyCarPlayBrowser \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/MyCarPlayBrowserDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package iPhone app
        run: |
          cd "$RUNNER_TEMP/MyCarPlayBrowserDerivedData/Build/Products/Debug-iphoneos"
          zip -r "$RUNNER_TEMP/MyCarPlayBrowser-iPhone-App.zip" MyCarPlayBrowser.app
      - name: Upload iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: MyCarPlayBrowser-iPhone-App
          path: ${{ runner.temp }}/MyCarPlayBrowser-iPhone-App.zip
