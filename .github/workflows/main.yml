name: MyCarPlayBrowser iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        working-directory: MyCarPlayBrowser_iOS_v0.2
        run: |
          rm -rf "$RUNNER_TEMP/MyCarPlayBrowserDerivedData"
          xcodebuild             -project MyCarPlayBrowser.xcodeproj             -scheme MyCarPlayBrowser             -sdk iphonesimulator             -configuration Debug             -derivedDataPath "$RUNNER_TEMP/MyCarPlayBrowserDerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: MyCarPlayBrowser-iOS-App
          path: ${{ runner.temp }}/MyCarPlayBrowserDerivedData/Build/Products/Debug-iphonesimulator/MyCarPlayBrowser.app
